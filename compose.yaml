# PostgreSQL（阶段二启用）：docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: tradepilot-db
    environment:
      POSTGRES_USER: tradepilot
      POSTGRES_PASSWORD: tradepilot
      POSTGRES_DB: tradepilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradepilot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
